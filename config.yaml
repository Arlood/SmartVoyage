# SmartVoyage 配置文件
# 优先级：环境变量(.env) > 本文件 > 代码中的兜底默认值
#
# 【说明】本项目的大模型与第三方 API 密钥默认在本文件中配置；
#         如需临时覆盖，可在 .env 或系统环境变量中设置同名变量（优先级更高）。
#         本文件包含真实密钥，请勿提交到公开仓库。

## ===== 大模型（支持任意 OpenAI 兼容服务：阿里云百炼 / DeepSeek / OpenAI / 硅基流动 / 本地 Ollama 等）=====
## 切换供应商只需改 base_url + api_key + model_* 三项，示例：
##   阿里云百炼：base_url=https://dashscope.aliyuncs.com/compatible-mode/v1  model=qwen-plus
##   DeepSeek  ：base_url=https://api.deepseek.com/v1                        model=deepseek-chat
##   硅基流动  ：base_url=https://api.siliconflow.cn/v1                      model=Qwen/Qwen2.5-72B-Instruct
llm:
  base_url: "https://api.deepseek.com/v1"            # 可用 LLM_BASE_URL 覆盖
  api_key: ""                                        # 【密钥】请在 .env 中设置 LLM_API_KEY
  model_name: "deepseek-flash"                       # 主模型（可用 LLM_MODEL 覆盖）
  model_premium: "deepseek-flash"                    # 高级模型：规划、景点生成（LLM_MODEL_PREMIUM）
  model_flash: "deepseek-flash"                      # 快速模型：意图识别、总结（LLM_MODEL_FLASH）
#
## ===== MySQL 数据库 =====
#database:
#  host: "localhost"                  # Docker 部署时由环境变量 DB_HOST 覆盖为 mysql
#  user: "smart_voyage"               # 统一账号（本地与 Docker 一致），可用环境变量 DB_USER 覆盖
#  password: ""                       # 【密钥】请在 .env 设置 DB_PASSWORD
#  name: "travel_rag"                 # 数据库名
#
## ===== 第三方 API 密钥 =====
## 和风天气：https://dev.qweather.com/    → 可用 HEFENG_API_KEY 覆盖
## 高德地图：https://lbs.amap.com/        → 可用 AMAP_API_KEY 覆盖
## 博查搜索：https://open.bochaai.com     → 可用 BOCHA_API_KEY 覆盖（未配置时降级为教学样例数据）
## 飞常准：https://mcp.variflight.com/    → 可用 VARIFLIGHT_API_KEY 覆盖
api_keys:
  hefeng_weather: ""    # 【密钥】请在 .env 中设置 HEFENG_API_KEY
  amap: ""              # 【密钥】请在 .env 中设置 AMAP_API_KEY
  bocha_search: ""      # 【密钥】请在 .env 中设置 BOCHA_API_KEY
  variflight: ""        # 【密钥】请在 .env 中设置 VARIFLIGHT_API_KEY

# ===== 第三方 API 地址（通常无需修改）=====
api_urls:
  hefeng_weather: "https://ny3yfudehk.re.qweatherapi.com/v7/weather/30d"
  amap: "https://restapi.amap.com"
  bocha_search: "https://api.bochaai.com/v1/web-search"
  variflight_mcp: "https://ai.variflight.com/servers/aviation/mcp"

# ===== 业务配置 =====
business:
  enable_complex_task: true        # 启用规划 + ReAct 拆解流程
  business_mcp_url: "http://localhost:8005/mcp"   # 内部业务 MCP 服务地址
  temperature: 0.1                 # LLM 温度参数（0.0=确定性最高，1.0=最随机）

# ===== 服务端口配置 =====
# 本地开发时使用 localhost + 默认端口；Docker 部署时通过环境变量覆盖
ports:
  api_host: "0.0.0.0"              # API 服务器监听地址
  api_port: 8080                   # API 服务器端口
  mcp_host: "0.0.0.0"              # MCP 服务器监听地址
  mcp_port: 8002                   # MCP 服务器端口
  a2a_host: "0.0.0.0"              # A2A 服务器监听地址
  weather_port: 5005               # 天气 A2A 服务器端口
  ticket_port: 5006                # 票务 A2A 服务器端口
  trip_port: 5007                  # 行程 A2A 服务器端口

# ===== 服务地址配置（A2A 子代理）=====
# 本地开发时使用 localhost；Docker 部署时使用服务名（如 weather-a2a:5005）
a2a_urls:
  weather: "http://localhost:5005"   # 天气 A2A 服务器地址
  ticket: "http://localhost:5006"    # 票务 A2A 服务器地址
  trip: "http://localhost:5007"      # 行程 A2A 服务器地址

# ===== 外部 MCP 服务地址 =====
external_mcp_url: "http://localhost:8002/mcp"   # 统一外部 MCP 服务器地址

# ===== JWT 认证配置 =====
# secret 为开发默认占位值，生产环境请在 .env 用 JWT_SECRET 覆盖为随机字符串（建议 32 字节以上）
jwt:
  secret: "smartvoyage-dev-secret-key-change-in-production"
  algorithm: "HS256"
  expiration_days: 7               # token 有效期（天）
